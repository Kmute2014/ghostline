# Render Blueprint for Ghostline — two web services sharing Supabase Postgres.
#
# Deploy via Render dashboard → New → Blueprint, or push this file to the repo
# root and Render detects it. Secrets marked `sync: false` are filled in the
# dashboard (or via `render blueprint launch` prompts) — they are NOT stored
# in this file.
#
# Topology:
#   ghostline-web      — Next.js app (UI + REST API), standalone Node output
#   ghostline-realtime — socket.io service (presence, chat fan-out, sweeps)
#
# The web tier calls the realtime tier via INTERNAL_NOTIFY_URL (token-guarded
# /notify) and browsers connect to it via NEXT_PUBLIC_REALTIME_URL.

services:
  - type: web
    name: ghostline-web
    runtime: node
    plan: free # spin-down after idle; use "starter" for an always-on chat app
    buildCommand: npm install && npm run build
    startCommand: npm run start:node
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Realtime runs as its own service — never boot it inside the web tier
      - key: DISABLE_INPROCESS_REALTIME
        value: "1"
      # ── secrets (set in dashboard) ──
      - key: DATABASE_URL
        sync: false # Supabase POOLED string (port 6543, ?pgbouncer=true&sslmode=require)
      - key: DIRECT_URL
        sync: false # Supabase SESSION pooler string (port 5432)
      - key: INTERNAL_TOKEN
        sync: false # shared secret for /notify — same value on both services
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # ── cross-service wiring (set after the realtime service exists) ──
      - key: INTERNAL_NOTIFY_URL
        sync: false # https://ghostline-realtime.onrender.com/notify
      - key: NEXT_PUBLIC_REALTIME_URL
        sync: false # https://ghostline-realtime.onrender.com (inlined at build)

  - type: web
    name: ghostline-realtime
    runtime: node
    plan: free
    # Install root deps (Prisma client generate via postinstall) + realtime's
    # own deps, then run the TS entry with a pinned bun (no native build step).
    buildCommand: npm install && curl -fsSL https://bun.sh/install | bash && cd mini-services/realtime && npm install --no-save
    startCommand: ~/.bun/bin/bun mini-services/realtime/index.ts
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # ── secrets (set in dashboard) ──
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: INTERNAL_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
