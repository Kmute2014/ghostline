<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ghostline — offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1b1e41;
      color: #eceefc;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .ghost { font-size: 56px; filter: drop-shadow(0 0 24px rgba(139, 92, 246, .5)); }
    h1 { font-size: 20px; margin: 12px 0 6px; }
    p { color: #9aa0c3; font-size: 14px; max-width: 320px; line-height: 1.5; }
  </style>
</head>
<body>
  <div>
    <div class="ghost">👻</div>
    <h1>You're off the grid</h1>
    <p>Ghostline couldn't reach the signal. Check your connection and try again — your messages are waiting.</p>
  </div>
</body>
</html>
